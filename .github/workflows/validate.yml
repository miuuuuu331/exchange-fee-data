name: validate

on:
  push:
    paths: ["data/**", "schema/**", "scripts/**"]
  pull_request:
    paths: ["data/**", "schema/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate.py
